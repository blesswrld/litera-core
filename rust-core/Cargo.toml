[package]
name = "litera-core"
version = "0.1.0"
edition = "2021"
authors = ["Litera Acoustic Typography Studio"]
description = "Zero-allocation phonetic cadence, typographic ink density, and rhythmic prose analyzer in Rust."
license = "Apache-2.0"

[lib]
name = "litera_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "litera-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
